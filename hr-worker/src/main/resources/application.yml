# application.yml - Configuração básica Spring Boot
spring:
  application:
    name: hr-worker
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT}
  servlet:
    context-path: /api